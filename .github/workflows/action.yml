name: Frontend CI/CD — Build, Push y Deploy EC2

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener código fuente
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Docker Buildx (necesario para multi-stage)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login en Docker Hub con secrets
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Construir y publicar imagen multi-stage
      - name: Build y Push imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops_front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Deploy en EC2 Frontend via SSH
      - name: Deploy en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONT_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Instalar Docker si no está instalado (Amazon Linux 2023)
            if ! command -v docker &> /dev/null; then
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            # Login en Docker Hub desde EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Bajar imagen actualizada
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops_front:latest

            # Detener y eliminar contenedor anterior si existe
            sudo docker stop frontend || true
            sudo docker rm frontend || true

            # Levantar nuevo contenedor
            sudo docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:5000 \
              -e PORT=5000 \
              -e DEBUG=False \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e BACKEND_URL="${{ secrets.BACKEND_URL }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/devops_front:latest

            # Verificar que el contenedor está corriendo
            sudo docker ps | grep frontend
