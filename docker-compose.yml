services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-beandaur}/devops_front:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-clave_secreta_produccion}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
